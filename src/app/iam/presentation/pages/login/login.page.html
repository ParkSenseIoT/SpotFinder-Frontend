<div class="login-wrapper">
  <div class="login-container">

    <div class="login-header">
      <h2 class="login-title">
        <span class="text-primary">Spot</span>Finder
      </h2>
      <p class="login-subtitle">Admin Dashboard Access</p>
    </div>

    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="email" class="form-label">Email address</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-control"
          placeholder="admin@mall.com"
          [class.is-invalid]="loginForm.controls.email.invalid && loginForm.controls.email.touched"
        />
        @if (loginForm.controls.email.invalid && loginForm.controls.email.touched) {
          <span class="error-text">Please enter a valid email.</span>
        }
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-control"
          placeholder="••••••••"
        />
      </div>

      @if (authStore.error()) {
        <div class="alert-error">
          {{ authStore.error() }}
        </div>
      }

      <button
        type="submit"
        class="btn-primary"
        [disabled]="authStore.isLoading() || loginForm.invalid">

        @if (authStore.isLoading()) {
          <span class="spinner"></span> Procesando...
        } @else {
          Ingresar al Panel
        }
      </button>

    </form>
  </div>
</div>
